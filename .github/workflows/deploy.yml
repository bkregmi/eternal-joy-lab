name: Deploy to S3

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

permissions:
  id-token: write # Required for OIDC
  contents: read  # Required for checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout  Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm install
          node src/data/generate-playlist.js
          npm run build
        env:
          CI: false
          REACT_APP_ADMIN_USERNAME: ${{ secrets.REACT_APP_ADMIN_USERNAME }}
          REACT_APP_ADMIN_PASSWORD: ${{ secrets.REACT_APP_ADMIN_PASSWORD }}

      - name: Configure AWS  Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          output-env-credentials: true

      - name: Verify Secret Availability
        run: |
          if [ -z "${{ secrets.AWS_S3_BUCKET }}" ]; then
            echo "❌ Error: AWS_S3_BUCKET secret is empty. Check Environment/Secret settings."
            exit 1
          fi

      - name: Sync Build Folder to S3
        run: |
          aws s3 sync build/ s3://${{ secrets.AWS_S3_BUCKET }} --delete --exclude "media/*"